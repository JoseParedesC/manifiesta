bar('Liquidación de conductores (anticipos vs gastos justificados)')+tbl([['Conductor',r=>r.x.name],['Anticipos',r=>$$(r.an)],['Gastos justificados',r=>$$(r.ga)],['Saldo a favor empresa',r=>`<b class="${r.an-r.ga<0?'rd':''}">${$$(r.an-r.ga)}</b>`]],drv)},
report(){const d=D(),per=S.per,cl={};d.services.filter(s=>s.status=='Completado'&&s.date.startsWith(per)).forEach(s=>{cl[s.clientId]=(cl[s.clientId]||0)+s.value});
return bar('Reportes · '+per,`<input type="month" value="${per}" onchange="S.per=this.value;go()"><button onclick="csv()">Exportar CSV</button>`)+bar('Rentabilidad por vehículo')+tbl([['Vehículo',r=>r.plate],['Ingresos',r=>$$(calc(r.id,per).inc)],['Directos',r=>$$(calc(r.id,per).dir)],['Generales',r=>$$(calc(r.id,per).gen)],['Utilidad',r=>$$(calc(r.id,per).profit)]],d.vehicles)+
bar('Ingresos por cliente')+tbl([['Cliente',r=>nm('partners',r[0])],['Ingresos',r=>$$(r[1])]],Object.entries(cl))+
bar('Cartera vencida')+tbl([['Factura',r=>r.number],['Tipo',r=>r.kind],['Vence',r=>r.due],['Saldo',r=>$$(bal(r))]],d.invoices.filter(i=>bal(i)>0&&i.due<new Date().toISOString().slice(0,10)))},
admin(){const t=S.tenants.find(x=>x.id==S.ses.t),ms=S.mem.filter(m=>m.t==t.id);
return bar('Empresa, usuarios y cupos',`<span class="t">Cupos ${ms.length}/${t.seats}</span><button class="p" onclick="uf()">+ Membresía</button>`)+tbl([['Usuario',r=>S.users.find(u=>u.id==r.u).name],['Rol',r=>`<span class="t">${r.role}</span>`],['Permisos',r=>ROLES[r.role].join(', ')],['',r=>`<button class="s d" onclick="um('${r.u}')">Quitar</button>`]],ms)+bar('Auditoría')+tbl([['Fecha',r=>r.ts],['Usuario',r=>r.u],['Acción',r=>r.a]],D().audit.slice(0,25))}};

Object.assign(VIEWS,{
dash(){const d=D(),per=S.per,vs=d.vehicles.map(v=>({v,p:calc(v.id,per).profit})),util=vs.reduce((a,x)=>a+x.p,0),mx=Math.max(1,...vs.map(x=>Math.abs(x.p)));
const em=d.invoices.filter(i=>i.kind=='emitida'),cxc=em.reduce((a,i)=>a+bal(i),0),cxp=d.invoices.filter(i=>i.kind=='recibida').reduce((a,i)=>a+bal(i),0);
const K=[['Servicios del mes',d.services.filter(s=>s.date.startsWith(per)).length,0,'🧭'],['Facturado',em.reduce((a,i)=>a+i.amount,0),1,'🧾'],['Por cobrar',cxc,1,'📥'],['Por pagar',cxp,1,'📤'],['Utilidad consolidada',util,1,'📊'],['Vehículos activos',d.vehicles.filter(v=>v.status=='Activo').length,0,'🚚']];
return bar('Resumen '+per+' · '+S.tenants.find(t=>t.id==S.ses.t).name)+`<div class="k">${K.map((k,i)=>`<div class="c" style="--i:${i}"><span class="ic">${k[3]}</span><small>${k[0]}</small><h3 data-n="${k[1]}" ${k[2]?'data-m="1"':''}>0</h3></div>`).join('')}</div>`+
`<div class="g">${`<div><div class="bar"><h2>Utilidad por vehículo</h2></div><div class="c">${vs.map(x=>`<div class="br"><span>${x.v.plate}</span><div class="bt"><i class="${x.p<0?'neg':''}" style="--w:${Math.abs(x.p)/mx*100}%"></i></div><b>${$$(x.p)}</b></div>`).join('')||'<div class="empty">Sin vehículos</div>'}</div></div>`}<div>${bar('Últimos servicios')}${tbl([['Manifiesto',r=>r.manifest],['Ruta',r=>r.origin+' → '+r.dest],['Estado',r=>`<span class="t">${r.status}</span>`]],[...d.services].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}</div></div>`},
partners(){return bar('Terceros (clientes y proveedores)')+mc('partners')},
fleet(){const d=D();return bar('Vehículos')+mc('vehicles')+bar('Conductores')+mc('drivers')+bar('Historial de mantenimiento','<button class="p" onclick="mf()">+ Mantenimiento</button>')+tbl([['Fecha',r=>r.date],['Vehículo',r=>nm('vehicles',r.vehicleId,'plate')],['Descripción',r=>r.desc],['Costo',r=>$$(r.cost)]],d.maint)}});

/* acciones */
function mf(){form('Registrar mantenimiento',[{k:'vehicleId',l:'Vehículo',ms:'vehicles'},{k:'date',l:'Fecha',t:'date',v:NOW+'-15'},{k:'desc',l:'Descripción'},{k:'cost',l:'Costo',t:'number'}],f=>{if(guard(f.vehicleId,f.date))return false;D().maint.push({id:uid(),...f});D().moves.push({id:uid(),date:f.date,type:'gasto',cat:'directo',vehicleId:f.vehicleId,amount:f.cost,desc:'Mantenimiento: '+f.desc,auto:1});log('Mantenimiento '+f.desc)})}
function sf(){const d=D();form('Nuevo servicio',[{k:'date',l:'Fecha',t:'date',v:NOW+'-20'},{k:'vehicleId',l:'Vehículo',ms:'vehicles'},{k:'driverId',l:'Conductor',ms:'drivers'},{k:'clientId',l:'Cliente',ms:'clients'},{k:'mov',l:'Movimiento',o:['TRAS','EXPO','IMPO','VACIO'].map(x=>[x,x])},{k:'origin',l:'Origen'},{k:'dest',l:'Destino'},{k:'manifest',l:'Manifiesto'},{k:'value',l:'Valor flete',t:'number'}],f=>{if(!d.vehicles.length||!d.drivers.length){toast('Cree vehículos y conductores antes');return false}if(guard(f.vehicleId,f.date))return false;d.services.push({id:uid(),...f,status:'Abierto'});log('Servicio '+f.manifest)})}
function ss(id,v){const s=D().services.find(x=>x.id==id);if(guard(s.vehicleId,s.date)){go();return}s.status=v;log('Servicio '+s.manifest+' → '+v);go()}
function invE(){const d=D(),av=d.services.filter(s=>s.status=='Completado'&&!s.invoiceId);if(!av.length){toast('No hay servicios completados sin facturar');return}
form('Emitir factura',[{k:'sid',l:'Servicio a facturar',o:av.map(s=>[s.id,s.manifest+' · '+nm('partners',s.clientId)+' · '+$$(s.value)])},{k:'due',l:'Vence',t:'date',v:'2026-12-20'}],f=>{const s=d.services.find(x=>x.id==f.sid),i={id:uid(),kind:'emitida',number:num('FV','FV'),partnerId:s.clientId,date:new Date().toISOString().slice(0,10),due:f.due,amount:s.value,paid:0,sids:[s.id]};d.invoices.push(i);s.invoiceId=i.id;log('Emitió '+i.number)})}
function invR(){form('Factura recibida',[{k:'partnerId',l:'Proveedor',ms:'suppliers'},{k:'number',l:'N° proveedor'},{k:'due',l:'Vence',t:'date'},{k:'amount',l:'Total',t:'number'},{k:'file',l:'Adjunto (nombre de archivo)',r:false}],f=>{D().invoices.push({id:uid(),kind:'recibida',date:new Date().toISOString().slice(0,10),paid:0,...f});log('Registró factura recibida '+f.number)})}
function payF(id){const i=D().invoices.find(x=>x.id==id),e=i.kind=='emitida';form((e?'Recaudo ':'Pago ')+i.number,[{k:'amount',l:'Valor (saldo '+$$(bal(i))+')',t:'number',v:bal(i)}],f=>{if(f.amount<=0||f.amount>bal(i)){toast('Valor inválido');return false}i.paid+=f.amount;D().moves.push({id:uid(),date:new Date().toISOString().slice(0,10),type:e?'recaudo':'pago',cat:'directo',vehicleId:'',invoiceId:id,amount:f.amount,desc:i.number,auto:1});log((e?'Recaudo ':'Pago ')+i.number)})}
function dl(id){const i=D().invoices.find(x=>x.id==id),t=S.tenants.find(x=>x.id==S.ses.t);const h=`<html><meta charset=utf-8><body style="font-family:sans-serif"><h2>${t.name}</h2><h3>Factura ${i.kind} ${i.number}</h3><p>Tercero: ${nm('partners',i.partnerId)}<br>Fecha: ${i.date} · Vence: ${i.due}</p><h3>Total: ${$$(i.amount)}</h3><p>Saldo: ${$$(bal(i))}</p><small>Documento interno, sin validez DIAN.</small></body></html>`;
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download=i.number+'.html';a.click()}
function mvf(){const d=D();form('Nuevo movimiento',[{k:'type',l:'Tipo',o:[['ingreso','Ingreso'],['gasto','Gasto'],['anticipo','Anticipo a conductor']]},{k:'cat',l:'Clase de gasto',o:[['directo','Directo (vehículo)'],['general','General (empresa)']]},{k:'date',l:'Fecha',t:'date',v:NOW+'-20'},{k:'vehicleId',l:'Vehículo',ms:'vehicles',r:false},{k:'driverId',l:'Conductor',ms:'drivers',r:false},{k:'desc',l:'Detalle'},{k:'amount',l:'Valor',t:'number'}],f=>{
if(f.type=='gasto'&&f.cat=='directo'&&!f.vehicleId){toast('Un gasto directo requiere vehículo');return false}if(f.type=='anticipo'&&!f.driverId){toast('Un anticipo requiere conductor');return false}if(f.amount<=0){toast('Valor inválido');return false}if(guard(f.vehicleId,f.date))return false;d.moves.push({id:uid(),...f});log('Movimiento '+f.type+' '+$$(f.amount))})}
function mvd(id){const m=D().moves.find(x=>x.id==id);if(guard(m.vehicleId,m.date))return;del('moves',id)}
async function close_(v){const per=S.per,c=calc(v,per),veh=D().vehicles.find(x=>x.id==v);if(!await dlg('Cerrar período','¿Cerrar '+veh.plate+' '+per+'? Se bloquearán modificaciones.'))return;
D().settles.push({id:uid(),vehicleId:v,period:per,...c,dist:(veh.agree||[]).map(a=>({name:a.name,pct:a.pct,amount:c.profit>0?c.profit*a.pct/100:0})),closedBy:U().name});log('Cerró liquidación '+veh.plate+' '+per);go()}
async function rev(id){const r=await dlg('Reversar liquidación','Justificación obligatoria para reabrir el período.',1);if(!r)return;const s=D().settles.find(x=>x.id==id);s.rev=true;s.reason=r;log('Reversó liquidación '+s.period+': '+r);go()}
function uf(){const t=S.tenants.find(x=>x.id==S.ses.t);form('Agregar membresía',[{k:'u',l:'Usuario',o:S.users.map(u=>[u.id,u.name])},{k:'role',l:'Rol',o:Object.keys(ROLES).map(r=>[r,r])}],f=>{if(S.mem.some(m=>m.u==f.u&&m.t==t.id)){toast('Ya es miembro');return false}if(S.mem.filter(m=>m.t==t.id).length>=t.seats){toast('Cupos agotados');return false}S.mem.push({u:f.u,t:t.id,role:f.role});log('Membresía '+f.role)})}
function um(u){if(u==S.ses.u){toast('No puede quitarse a sí mismo');return}S.mem=S.mem.filter(m=>!(m.u==u&&m.t==S.ses.t));go()}
function csv(){const per=S.per,r=[['Vehiculo','Ingresos','Directos','Generales','Utilidad'],...D().vehicles.map(v=>{const c=calc(v.id,per);return[v.plate,c.inc,c.dir,Math.round(c.gen),Math.round(c.profit)]})];
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.map(x=>x.join(',')).join('\n')],{type:'text/csv'}));a.download='rentabilidad-'+per+'.csv';a.click()}

go(1);if(location.hash=='#cotizacion')quote();
</script></body></html>
